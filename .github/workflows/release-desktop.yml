name: Release Desktop (Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer (NSIS)
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\src\frontend\src-tauri\target

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/frontend/src-tauri

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Build Tauri app (NSIS)
        working-directory: src/frontend
        run: npm run tauri build

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: jdisc-windows-nsis
          path: src/frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: src/frontend/src-tauri/target/release/bundle/nsis/*.exe
