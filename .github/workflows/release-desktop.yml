name: Release Desktop (Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer & Updater (NSIS)
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\src\frontend\src-tauri\target

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/frontend/src-tauri

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Prepare version and updater config
        id: prep
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $confPath = "src/frontend/src-tauri/tauri.conf.json"
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json

          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $tagVersion = "${{ github.ref_name }}".TrimStart("v")
            $conf.version = $tagVersion
            Write-Host "Synced tauri.conf.json version to $tagVersion"
          }

          $hasKey = -not [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)
          if (-not $hasKey) {
            Write-Warning "Secret TAURI_SIGNING_PRIVATE_KEY não configurado. Gerando instalador sem assinatura de auto-update."
            $conf.bundle.createUpdaterArtifacts = $false
          }

          $conf | ConvertTo-Json -Depth 10 | Set-Content $confPath -Encoding utf8
          "APP_VERSION=$($conf.version)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "has_signing_key=$($hasKey.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build Tauri app (NSIS)
        working-directory: src/frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Generate latest.json updater manifest
        if: steps.prep.outputs.has_signing_key == 'true'
        shell: pwsh
        run: |
          $bundleDir = "src/frontend/src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem -Path $bundleDir -Filter "*-setup.exe" | Select-Object -First 1
          $sig = Get-ChildItem -Path $bundleDir -Filter "*-setup.exe.sig" | Select-Object -First 1

          if (-not $exe -or -not $sig) {
            throw "Arquivos .exe ou .exe.sig não encontrados em $bundleDir"
          }

          $sigContent = (Get-Content $sig.FullName -Raw).Trim()
          $tagName = if ("${{ github.ref }}" -like "refs/tags/v*") { "${{ github.ref_name }}" } else { "v$($env:APP_VERSION)" }
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/$tagName/$($exe.Name)"

          $manifest = [ordered]@{
            version = $env:APP_VERSION
            notes = "Atualização jdisc $tagName"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $sigContent
                url = $downloadUrl
              }
            }
          }

          $manifestPath = Join-Path $bundleDir "latest.json"
          $manifest | ConvertTo-Json -Depth 5 | Set-Content $manifestPath -Encoding utf8
          Write-Host "Generated $manifestPath for $downloadUrl"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jdisc-windows-nsis
          path: |
            src/frontend/src-tauri/target/release/bundle/nsis/*.exe
            src/frontend/src-tauri/target/release/bundle/nsis/*.sig
            src/frontend/src-tauri/target/release/bundle/nsis/latest.json
          if-no-files-found: error

      - name: Publish GitHub Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            src/frontend/src-tauri/target/release/bundle/nsis/*.exe
            src/frontend/src-tauri/target/release/bundle/nsis/*.sig
            src/frontend/src-tauri/target/release/bundle/nsis/latest.json
